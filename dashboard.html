<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Horarios - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');
    </style>
</head>
<body>
    <div class="dashboard-layout">
        
        <aside class="sidebar bg-dark-blue">
            <div class="logo-area">
                <span class="logo-text">MINDBOX 2</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item nav-active">Horario General</a>
                <a href="#" class="nav-item">Gestión de Materias</a>
                <a href="#" class="nav-item">Gestión de Docentes</a>
                <a href="#" class="nav-item">Gestión de Aulas</a>
                <a href="#" class="nav-item">Gestión de Grupos</a>

                <hr class="nav-separator">
                
                <div class="user-info">
                    <span class="user-role">Rol: Subdirector</span>
                    <a href="index.html" class="nav-item logout-link">Cerrar Sesión</a>
                </div>
            </nav>
        </aside>

        <main class="content-area">
            <header class="content-header">
                <h1 class="header-title" id="view-title">Vista de Horario General</h1>
            </header>
            
            <section id="app-content" class="card p-30">
                <h2 class="section-title">Visualización de la Parrilla de Horarios</h2>
                
                <div class="mock-controls">
                    <button class="btn btn-secondary">Filtrar por Docente</button>
                    <button class="btn btn-secondary">Filtrar por Aula</button>
                    <button class="btn btn-primary">Crear Nuevo Horario</button>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
