<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Horarios - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');
    </style>
</head>
<body class="login-body">
    <main class="login-card">
        <h1 class="card-title text-primary">Sistema de Gestión de Horarios</h1>
        <form class="login-form">
            <h2 class="card-subtitle">Iniciar Sesión</h2>
            
            <div class="form-group">
                <label for="username">Usuario/Matrícula</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Acceder</button>
            
            <p class="role-hint">
                <a href="dashboard.html" class="text-secondary">Ir al Dashboard (Simulación)</a>
            </p>
        </form>
    </main>
</body>
</html>
